<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Chunk Hunt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, one task per screen. Each grammar structure owns one highlight color, always used as a soft tint with a solid underline. */
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14161c; --soft:#646b7a; --line:#e2e5ea;
  --m-subj:#12a37a; --m-verb:#e0457b; --m-prep:#d99a00; --m-verbal:#7b5cf0; --m-voice:#2f7de1; --m-boss:#5b6474;
  --good:#12a37a; --bad:#d6455d;
  --display:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1014; --card:#16191f; --ink:#eceef2; --soft:#9aa1b0; --line:#272b34; --m-subj:#3fcf9f; --m-verb:#ff6b9d; --m-prep:#f0b93a; --m-verbal:#a48bff; --m-voice:#6aa8ff; --m-boss:#9aa1b0; --good:#3fcf9f; --bad:#ff7a8a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1014; --card:#16191f; --ink:#eceef2; --soft:#9aa1b0; --line:#272b34; --m-subj:#3fcf9f; --m-verb:#ff6b9d; --m-prep:#f0b93a; --m-verbal:#a48bff; --m-voice:#6aa8ff; --m-boss:#9aa1b0; --good:#3fcf9f; --bad:#ff7a8a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:28px 56px;-webkit-font-smoothing:antialiased}
#app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,.num{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:1.5rem;line-height:1.2}
h1 mark{background:none;color:var(--soft)}
h2{font-size:1.3rem;line-height:1.25}
p{margin:0}
.soft{color:var(--soft)}
.small{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:32px;flex-wrap:wrap;padding-block:4px}
.stat .num{font-size:1.25rem;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.875rem;color:var(--soft)}
.ghost:hover{color:var(--ink);border-color:var(--soft)}

.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mission{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .12s}
.mission:hover:not(:disabled){border-color:var(--soft)}
.mission:disabled{opacity:.5;cursor:not-allowed}
.swatch{height:8px;width:8px;border-radius:50%;background:var(--mk);margin-bottom:6px}
.mission b{font-weight:600;font-size:1rem}
.stars{display:flex;gap:4px;margin-top:6px}
.stars i,.big i{font-size:0;display:block;height:4px;width:18px;border-radius:2px;background:var(--line)}
.stars i.on,.big i.on{background:var(--ink)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px}
@media (max-width:480px){.panel{padding:18px}}
.rule{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.rule li{padding-left:14px;border-left:2px solid var(--mk);line-height:1.9}
.trick{background:color-mix(in srgb,var(--mk) 10%,transparent);border:1px solid color-mix(in srgb,var(--mk) 35%,transparent);border-radius:10px;padding:12px 14px;font-weight:500}

.bar{display:flex;gap:4px}
.bar i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.bar i.done{background:var(--mk)}
.bar i.now{background:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ask{font-size:1.1rem;font-weight:600}
.ask b,.sentence b,.ex b:not([class]){background:color-mix(in srgb,var(--mk) 20%,transparent);box-shadow:inset 0 -2px 0 var(--mk);padding:1px 5px;border-radius:4px;font-weight:600;color:var(--ink)}
.sentence{font-size:1.05rem;color:var(--soft);line-height:1.8}
.chunks{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;font-size:1.05rem}
.chunk{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;transition:border-color .1s,background .1s}
.chunk:hover:not(:disabled){border-color:var(--soft)}
.chunk.sel{background:color-mix(in srgb,var(--mk) 20%,transparent);border-color:var(--mk);font-weight:600}
.chunk.hit{box-shadow:0 0 0 2px var(--good)}
.chunk.miss{border:2px dashed var(--good)}
.chunk.wrong{box-shadow:0 0 0 2px var(--bad);text-decoration:line-through}
.chunk:disabled{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:52px;font-weight:500;text-align:left}
.opt:hover:not(:disabled){border-color:var(--soft)}
.opt.hit{box-shadow:0 0 0 2px var(--good)}
.opt.wrong{box-shadow:0 0 0 2px var(--bad);text-decoration:line-through}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 22px;font-weight:600;font-size:1rem;min-height:46px}
.go:hover:not(:disabled){opacity:.88}
.go:disabled{opacity:.3;cursor:not-allowed}
.fb{border-radius:12px;padding:16px;border:1px solid color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 7%,transparent);display:flex;flex-direction:column;gap:8px}
.fb.no{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 6%,transparent)}
.fb strong{font-size:1.05rem;font-weight:600}
.ex{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ex li{padding-left:12px;border-left:2px solid var(--mk);line-height:1.8}
.hint{border-left:2px solid var(--mk);padding-left:12px}
.big{display:flex;gap:6px}
.big i{height:6px;width:48px;border-radius:3px}

.xray{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;display:flex;flex-direction:column;gap:10px}
.xr{font-size:1.05rem;line-height:2.2}
.rs{--c:var(--m-subj)} .rv{--c:var(--m-verb)} .rp{--c:var(--m-prep)} .rx{--c:var(--m-verbal)}
.xr span[class],.panel b[class]{background:color-mix(in srgb,var(--c) 20%,transparent);box-shadow:inset 0 -2px 0 var(--c);padding:2px 6px;border-radius:4px;color:var(--ink);font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.xr span.us,.panel b.us{box-shadow:inset 0 -2px 0 var(--c),0 3px 0 var(--m-subj)}
.panel b.rn{background:none;box-shadow:none;outline:1px dashed var(--soft);outline-offset:-1px}
.xr sup{font-size:.58em;font-weight:500;margin-left:4px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.brush{border:1px solid var(--mk);border-radius:8px;padding:8px 14px;min-height:42px;font-weight:600;font-size:.9rem;background:color-mix(in srgb,var(--mk) 20%,transparent)}
.brush.erase{background:none;border:1px dashed var(--soft);color:var(--soft)}
.brush.on{box-shadow:0 0 0 2px var(--ink)}
.rule li:has(b.rs){border-left-color:var(--m-subj)}
.rule li:has(b.rv){border-left-color:var(--m-verb)}
.rule li:has(b.rp){border-left-color:var(--m-prep)}
.rule li:has(b.rx){border-left-color:var(--m-verbal)}
.rule li:has(b.rn){border-left-color:var(--line)}
.rule li:has(b.rv):has(b.rs){border-left-color:var(--ink)}
@media (prefers-reduced-motion: reduce){.chunk,.mission{transition:none}}
</style>

<main id="app"></main>

<script src="question-bank.js"></script>
<script>
/* Content lives in question-bank.js. This file is code only. */
var BANK=window.CHUNK_HUNT_BANK||{sentences:[],missions:{}};
var SENT=[];
BANK.sentences.forEach(function(g){g.items.forEach(function(s){SENT.push(s);});});
var OPT_VERBAL=["Gerund (acts like a noun)","Participle (acts like an adjective)","Infinitive (to + verb)","Prepositional phrase"];
var OPT_VOICE=["Active voice","Passive voice"];
var PAINT=[["s","Subject","--m-subj"],["v","Verb","--m-verb"],["p","Prepositional phrase","--m-prep"],["x","Verbal","--m-verbal"]];

function isS(c){return c.r.indexOf("s")>=0;}
function isV(c){return /[vV]/.test(c.r);}
function isP(c){return c.r.indexOf("p")>=0;}
function verbal(c){var m=c.r.match(/[iga]/);return m?m[0]:"";}

var WORLDS=[
{id:"verb",name:"Verbs",skill:"Find the verbs",mark:"--m-verb",type:"select",ask:"Tap every <b>verb</b>",test:isV},
{id:"subj",name:"Subjects",skill:"Find the complete subjects",mark:"--m-subj",type:"select",ask:"Tap every chunk of a <b>complete subject</b>",test:isS},
{id:"prep",name:"Prepositional phrases",skill:"Find the prepositional phrases",mark:"--m-prep",type:"select",ask:"Tap every <b>prepositional phrase</b>",test:isP},
{id:"verbal",name:"Verbals",skill:"Gerund, participle or infinitive?",mark:"--m-verbal",type:"pick",ask:"What is the <b>highlighted</b> part?",opts:OPT_VERBAL},
{id:"voice",name:"Active and passive",skill:"Active or passive?",mark:"--m-voice",type:"pick",ask:"Is the <b>highlighted</b> verb active or passive?",opts:OPT_VOICE},
{id:"paint",name:"Full markup",skill:"Mark every structure in the sentence",mark:"--m-boss",type:"paint",round:5,ask:"Pick a color, then tap the chunks. <b>Color everything you can.</b>"}
];
WORLDS.forEach(function(w){var k=BANK.missions[w.id]||{};w.rule=k.rule||[];w.trick=k.trick||"";w.ex=k.ex||[];});
var BOSS={id:"boss",name:"Mixed set",skill:"Two questions from each set",mark:"--m-boss"};
var ROUND=10;

var save={xp:0,stars:{},last:"",days:0,sound:true};
try{var raw=localStorage.getItem("chunkhunt");if(raw){var o=JSON.parse(raw);for(var k in o)save[k]=o[k];}}catch(e){}
function persist(){try{localStorage.setItem("chunkhunt",JSON.stringify(save));}catch(e){}}

var app=document.getElementById("app"),view="home",G=null,actx=null;

function beep(f,d){
  if(!save.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=f;o.type="triangle";g.gain.value=.08;
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d);
  }catch(e){}
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dayStr(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function starsHtml(n){var h="";for(var i=1;i<=3;i++)h+='<i class="'+(i<=n?"on":"")+'">&#9733;</i>';return h;}
function parse(s){
  return s.split("|").map(function(c){
    var i=c.indexOf(":"),m=c.slice(i+1).match(/^(.*?)([.,;!?]*)$/);
    return {r:c.slice(0,i),text:m[1],punct:m[2]};
  });
}
function quote(a){return a.map(function(t){return "“"+t+"”";}).join(", ");}
function bossOpen(){var n=0;WORLDS.forEach(function(w){if(save.stars[w.id])n++;});return n>=3;}
function world(id){return WORLDS.filter(function(x){return x.id===id;})[0];}

/* Build one question for a mission from one sentence. */
function makeItem(w,raw){
  var cs=parse(raw),it={w:w,cs:cs},idx=[],pref=[];
  if(w.id==="verbal"){
    cs.forEach(function(c,n){if(verbal(c))pref.push(n);else if(isP(c)){idx.push(n);if(/^to /i.test(c.text))idx.push(n,n);}});
    var pool=pref.length&&(Math.random()<.75||!idx.length)?pref:idx;
    it.tgt=shuffle(pool)[0];var c=cs[it.tgt],k=verbal(c);
    it.a=k==="g"?0:k==="a"?1:k==="i"?2:3;
    it.why=k==="g"?"It names an activity, a thing. Swap in \"it\" and the sentence still works.":k==="a"?"It describes the noun beside it, the way an adjective does.":k==="i"?"to + verb.":"A preposition followed by a noun, not a verb.";
  }else if(w.id==="voice"){
    cs.forEach(function(c,n){if(c.r==="V")pref.push(n);else if(c.r==="v")idx.push(n);});
    var pl=pref.length&&(Math.random()<.55||!idx.length)?pref:idx;
    it.tgt=shuffle(pl)[0];var t=cs[it.tgt];it.a=t.r==="V"?1:0;
    it.why=t.r==="V"?"A form of be + past participle. The subject receives the action.":/^(was|were|is|are|am) \w+ing$/.test(t.text)?"be + -ing is an ongoing action. The subject is still doing it.":/^(has|have|had) /.test(t.text)?"have + past participle is still active. The subject did it.":"The subject does the action.";
  }
  return it;
}
function startRound(id){
  var items=[];
  if(id==="boss"){WORLDS.forEach(function(w){if(w.id==="paint")return;shuffle(SENT).slice(0,2).forEach(function(r){items.push(makeItem(w,r));});});}
  else{var w=world(id);items=shuffle(SENT).slice(0,w.round||ROUND).map(function(r){return makeItem(w,r);});}
  G={id:id,total:items.length,queue:shuffle(items),i:0,sel:{},paint:{},brush:"v",picked:-1,checked:false,ok:false,first:0,xp:0,streak:0,hint:false};
  view="play";render();
}
function finish(){
  var stars=G.first>=G.total?3:G.first>=G.total*0.7?2:1;
  G.stars=stars;
  if(!(save.stars[G.id]>=stars))save.stars[G.id]=stars;
  save.xp+=G.xp;
  var today=dayStr(new Date()),y=new Date();y.setDate(y.getDate()-1);
  if(save.last!==today){save.days=(save.last===dayStr(y))?save.days+1:1;save.last=today;}
  persist();beep(880,.5);view="done";render();
}
function accepts(c){var a=[];if(isS(c))a.push("s");if(isV(c))a.push("v");if(isP(c))a.push("p");if(verbal(c))a.push("x");return a;}
function grade(ok){
  var it=G.queue[G.i];G.checked=true;G.ok=ok;
  if(ok){
    if(it.retry){G.xp+=5;}else{G.first++;G.streak++;G.xp+=(it.w.type==="paint"?20:10)+Math.min(G.streak,5)*2;}
    beep(660,.18);
  }else{
    G.streak=0;beep(180,.25);
    if(!it.retry){var again={};for(var k in it)again[k]=it[k];again.retry=true;G.queue.push(again);}
    G.ex=shuffle(it.w.ex).slice(0,2);
  }
  render();
  var n=document.getElementById("next");if(n)n.focus();
}
function roleName(r){return PAINT.filter(function(p){return p[0]===r;})[0][1].toLowerCase();}

/* The whole sentence with every structure colored. Shown after each answer. */
function xray(cs){
  var h='<div class="xray"><span class="small soft">The whole sentence, color-coded</span><p class="xr">';
  cs.forEach(function(c){
    var k=verbal(c),cl=isP(c)?"rp":k?"rx":isV(c)?"rv":isS(c)?"rs":"";
    if(isS(c)&&cl!=="rs")cl+=" us";
    var tag=k==="i"?"infinitive":k==="g"?"gerund":k==="a"?"participle":c.r==="V"?"passive":"";
    h+=(cl?'<span class="'+cl+'">':"")+c.text+(tag?"<sup>"+tag+"</sup>":"")+(cl?"</span>":"")+c.punct+" ";
  });
  h+='</p><div class="legend"><span><i style="background:var(--m-subj)"></i>Subject (also underlined)</span><span><i style="background:var(--m-verb)"></i>Verb</span>'+
     '<span><i style="background:var(--m-prep)"></i>Prepositional phrase</span><span><i style="background:var(--m-verbal)"></i>Verbal</span></div></div>';
  return h;
}
function explain(it){
  var w=it.w,cs=it.cs,h="";
  if(G.ok)return (it.why?'<span>'+it.why+'</span>':"")+xray(cs);
  if(w.type==="select"){
    var miss=[],extra=[];
    cs.forEach(function(c,n){if(w.test(c)&&!G.sel[n])miss.push(c.text);if(!w.test(c)&&G.sel[n])extra.push(c.text);});
    if(miss.length)h+='<span><b>You missed:</b> '+quote(miss)+'</span>';
    if(extra.length)h+='<span><b>Does not count:</b> '+quote(extra)+'</span>';
  }else if(w.type==="paint"){
    var fix=[];
    cs.forEach(function(c,n){var a=accepts(c),p=G.paint[n];
      if(a.length&&a.indexOf(p)<0)fix.push("“"+c.text+"” is a "+a.map(roleName).join(" or a "));
      if(!a.length&&p)fix.push("“"+c.text+"” gets no color");
    });
    h+='<span><b>Fix these:</b></span><ul class="ex">'+fix.map(function(f){return "<li>"+f+".</li>";}).join("")+'</ul>';
  }else h+='<span><b>The answer:</b> '+w.opts[it.a]+'</span><span><b>Why:</b> '+it.why+'</span>';
  h+='<span><b>Remember:</b> '+w.trick+'</span>';
  h+='<span><b>Two more like it:</b></span><ul class="ex">'+G.ex.map(function(e){return '<li>'+e[0]+'<br><span class="small soft">'+e[1]+'</span></li>';}).join("")+'</ul>';
  return h+xray(cs);
}

function render(){
  var h="";
  if(!SENT.length){app.innerHTML='<div class="panel"><h2>The question bank did not load</h2><p>Keep question-bank.js in the same folder as this page, then reload.</p></div>';return;}
  if(view==="home"){
    var total=0;for(var k in save.stars)total+=save.stars[k];
    h+='<div class="top"><div><h1>Chunk <mark>Hunt</mark></h1><p class="soft">Choose a set. Long sentences, one question at a time.</p></div>'+
       '<button class="ghost" id="snd">Sound: '+(save.sound?"on":"off")+'</button></div>'+
       '<div class="stats"><div class="stat"><b class="num">'+save.xp+'</b><span>XP</span></div>'+
       '<div class="stat"><b class="num">'+(Math.floor(save.xp/100)+1)+'</b><span>Level</span></div>'+
       '<div class="stat"><b class="num">'+total+' / 21</b><span>Progress</span></div>'+
       '<div class="stat"><b class="num">'+save.days+'</b><span>Day streak</span></div></div><div class="missions">';
    WORLDS.concat([BOSS]).forEach(function(w){
      var locked=w.id==="boss"&&!bossOpen();
      h+='<button class="mission" data-w="'+w.id+'" style="--mk:var('+w.mark+')"'+(locked?" disabled":"")+'><span class="swatch"></span><b>'+w.name+'</b>'+
         '<span class="small soft">'+(locked?"Finish 3 sets to unlock":w.skill)+'</span><span class="stars">'+starsHtml(save.stars[w.id]||0)+'</span></button>';
    });
    h+='</div>';
  }
  else if(view==="tip"){
    var w=G;
    h+='<div class="panel" style="--mk:var('+w.mark+')"><p class="small soft">'+w.name+' &middot; '+(w.round||ROUND)+' questions</p><h2>'+w.skill+'</h2><ul class="rule">'+
       w.rule.map(function(r){return "<li>"+r+"</li>";}).join("")+'</ul><p class="trick">'+w.trick+'</p>'+
       '<div class="row"><button class="ghost" id="home">Back</button><button class="go" id="start">Start</button></div></div>';
  }
  else if(view==="play"){
    var it=G.queue[G.i],w=it.w,cs=it.cs;
    h+='<div class="panel" style="--mk:var('+w.mark+')"><div class="bar">';
    G.queue.forEach(function(_,n){h+='<i class="'+(n<G.i?"done":n===G.i?"now":"")+'"></i>';});
    h+='</div><div class="row small soft"><span>'+(it.retry?"Second chance":"Question "+(G.i+1)+" of "+G.queue.length+(G.i>0&&G.i===Math.floor(G.total/2)?" · Halfway. Stretch if you want.":""))+'</span><span>Streak '+G.streak+' &middot; +'+G.xp+' XP</span></div>'+
       '<p class="ask">'+w.ask+'</p>';
    if(w.type==="select"||w.type==="paint"){
      var paint=w.type==="paint";
      if(paint&&!G.checked){
        h+='<div class="palette">'+PAINT.map(function(p){return '<button class="brush'+(G.brush===p[0]?" on":"")+'" data-b="'+p[0]+'" style="--mk:var('+p[2]+')" aria-pressed="'+(G.brush===p[0])+'">'+p[1]+'</button>';}).join("")+
           '<button class="brush erase'+(G.brush==="e"?" on":"")+'" data-b="e" aria-pressed="'+(G.brush==="e")+'">Eraser</button></div>';
      }
      h+='<div class="chunks">';
      cs.forEach(function(c,n){
        var on=paint?G.paint[n]:G.sel[n],cl="chunk"+(on?" sel":""),st="";
        if(paint&&on)st=' style="--mk:var('+PAINT.filter(function(p){return p[0]===on;})[0][2]+')"';
        if(G.checked){
          if(paint){var a=accepts(c);cl+=a.length?(a.indexOf(on)>=0?" hit":on?" wrong":" miss"):(on?" wrong":"");}
          else cl+=w.test(c)?(on?" hit":" miss"):(on?" wrong":"");
        }
        h+='<button class="'+cl+'" data-c="'+n+'"'+st+(G.checked?" disabled":"")+' aria-pressed="'+(!!on)+'">'+c.text+'</button>'+(c.punct?"<span>"+c.punct+"</span>":"");
      });
      h+='</div>';
      if(G.hint&&!G.checked){
        var cnt=paint?"Look for "+cs.filter(isV).length+" verb chunks, "+cs.filter(isP).length+" prepositional phrases and "+cs.filter(verbal).length+" verbals. ":"There are "+cs.filter(w.test).length+" chunks to find. ";
        h+='<p class="hint small">'+cnt+w.trick+'</p>';
      }
      if(!G.checked){
        var any=false,src=paint?G.paint:G.sel;for(var s in src)if(src[s])any=true;
        h+='<div class="row"><button class="ghost" id="hint">Hint</button><button class="go" id="check"'+(any?"":" disabled")+'>Check</button></div>';
      }
    }else{
      h+='<p class="sentence">'+cs.map(function(c,n){return (n===it.tgt?"<b>"+c.text+"</b>":c.text)+c.punct;}).join(" ")+'</p><div class="opts">';
      w.opts.forEach(function(o,n){
        var cl="opt";if(G.checked){if(n===it.a)cl+=" hit";else if(n===G.picked)cl+=" wrong";}
        h+='<button class="'+cl+'" data-o="'+n+'"'+(G.checked?" disabled":"")+'>'+o+'</button>';
      });
      h+='</div>';
      if(G.hint&&!G.checked)h+='<p class="hint small">'+w.trick+'</p>';
      if(!G.checked)h+='<div class="row"><button class="ghost" id="hint">Hint</button><span></span></div>';
    }
    if(G.checked){
      var last=G.i===G.queue.length-1;
      h+='<div class="fb'+(G.ok?"":" no")+'"><strong>'+(G.ok?(G.streak>=3?G.streak+" in a row.":"Correct."):"Not yet. You will see this one again.")+'</strong>'+explain(it)+
         '</div><div class="row"><button class="ghost" id="home">Quit</button><button class="go" id="next">'+(last?"Finish":"Next")+'</button></div>';
    }
    h+='</div>';
  }
  else if(view==="done"){
    var name=G.id==="boss"?BOSS.name:G.queue[0].w.name;
    h+='<div class="panel"><p class="small soft">'+name+' complete</p><div class="big">'+starsHtml(G.stars)+'</div>'+
       '<h2>'+G.first+' of '+G.total+' right on the first try</h2><p>+'+G.xp+' XP. You are at '+save.xp+' XP, level '+(Math.floor(save.xp/100)+1)+'.</p>'+
       '<p class="soft">'+(G.stars===3?"Perfect round. Try a different mission, or stop here.":"Good place for a break. Come back later and go for three stars.")+'</p>'+
       '<div class="row"><button class="ghost" id="again">Play again</button><button class="go" id="home">All sets</button></div></div>';
  }
  app.innerHTML=h;
}

app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.id==="snd"){save.sound=!save.sound;persist();render();beep(520,.1);}
  else if(b.id==="home"){view="home";G=null;render();}
  else if(b.dataset.w){
    if(b.dataset.w==="boss")startRound("boss");
    else{G=world(b.dataset.w);view="tip";render();}
  }
  else if(b.id==="start"){startRound(G.id);}
  else if(b.id==="again"){startRound(G.id);}
  else if(b.id==="hint"){G.hint=true;render();}
  else if(b.dataset.b){G.brush=b.dataset.b;render();}
  else if(b.dataset.c!==undefined){
    var n=b.dataset.c;
    if(G.queue[G.i].w.type==="paint"){if(G.brush==="e"||G.paint[n]===G.brush)delete G.paint[n];else G.paint[n]=G.brush;}
    else G.sel[n]=!G.sel[n];
    beep(440,.05);render();
  }
  else if(b.id==="check"){
    var it=G.queue[G.i],ok=true;
    it.cs.forEach(function(c,n){
      if(it.w.type==="paint"){var a=accepts(c),p=G.paint[n];if(a.length?a.indexOf(p)<0:!!p)ok=false;}
      else if(!!G.sel[n]!==!!it.w.test(c))ok=false;
    });
    grade(ok);
  }
  else if(b.dataset.o!==undefined){G.picked=+b.dataset.o;grade(G.picked===G.queue[G.i].a);}
  else if(b.id==="next"){
    if(G.i===G.queue.length-1)finish();
    else{G.i++;G.sel={};G.paint={};G.picked=-1;G.checked=false;G.hint=false;render();}
  }
});
render();
</script>

</body>
</html>
